<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Snake 2026</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0a0e1a;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      display: block;
      box-shadow: 0 0 80px rgba(74, 222, 128, 0.08);
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <script src="./js/config.js"></script>
  <script src="./js/systems/Storage.js"></script>
  <script src="./js/systems/Audio.js"></script>
  <script src="./js/systems/FX.js"></script>
  <script src="./js/systems/Daily.js"></script>
  <script src="./js/systems/Input.js"></script>
  <script src="./js/systems/Snake.js"></script>
  <script src="./js/systems/Food.js"></script>
  <script src="./js/systems/PowerUps.js"></script>
  <script src="./js/systems/Obstacles.js"></script>
  <script src="./js/systems/Boss.js"></script>
  <script src="./js/systems/Combo.js"></script>

  <script src="./js/scenes/Boot.js"></script>
  <script src="./js/scenes/Preload.js"></script>
  <script src="./js/scenes/MainMenu.js"></script>
  <script src="./js/scenes/Game.js"></script>
  <script src="./js/scenes/HUD.js"></script>
  <script src="./js/scenes/GameOver.js"></script>
  <script src="./js/scenes/Settings.js"></script>

  <script src="./js/main.js"></script>
</body>
</html>
